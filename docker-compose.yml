version: "3.9"
services:
  api:
    build: .
    container_name: api_health_api
    ports:
      - "8000:8000"
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  redis:
    image: redis:7
    container_name: api_health_redis
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus
    container_name: api_health_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana
    container_name: api_health_grafana
    ports:
      - "3030:3000"  # changed to avoid Windows port issue
    volumes:
      - grafana_data:/var/lib/grafana
    env_file:
      - .env

volumes:
  grafana_data: