services:
  api:
    build: .
    container_name: api_health_api
    ports:
      - "8000:8000"
    depends_on:
      - db
    command: ["sh", "wait-for-db.sh", "db", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    cap_add:
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined
    volumes:
      - .:/app
  
  gateway:
    build: .
    container_name: api_gateway
    command: uvicorn app.gateway:gateway --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"
    depends_on:
      - api
    volumes:
      - .:/app

  redis:
    image: redis:7
    container_name: api_health_redis
    ports:
      - "6380:6379"

  redis_exporter:
    image: oliver006/redis_exporter:latest
    container_name: redis_exporter
    environment:
      - REDIS_ADDR=redis://redis:6379
    ports:
      - "9121:9121"

  prometheus:
    image: prom/prometheus
    container_name: api_health_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana
    container_name: api_health_grafana
    ports:
      - "3030:3000"  # changed to avoid Windows port issue
    volumes:
      - grafana_data:/var/lib/grafana
    env_file:
      - .env

  # profiler:
  #   image: local-py-spy
  #   container_name: api_health_profiler
  #   pid: "service:api"
  #   cap_add:
  #     - SYS_PTRACE
  #   security_opt:
  #     - apparmor:unconfined
  #   volumes:
  #     - .:/data
  #   entrypoint: >
  #     py-spy record -o /data/profile.svg --pid 1 --duration 30


  db:
    image: postgres:15
    container_name: api_health_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  jaeger:
    image: jaegertracing/all-in-one:1.38
    container_name: jaeger
    ports:
    - "16686:16686"
    - "6831:6831/udp"


volumes:
  grafana_data:
  db_data: