version: "3.9"

services:
  api1:
    build:
      context: ../..
    container_name: api1
    environment:
      - PORT=8000
    ports:
      - "8001:8000"

  api2:
    build:
      context: ../..
    container_name: api2
    environment:
      - PORT=8000
    ports:
      - "8002:8000"

  redis:
    image: redis:7
    container_name: lb_redis

  nginx:
    image: nginx:latest
    container_name: fastapi_lb
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "9000:80"
    depends_on:
      - api1
      - api2
 
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: appdb
    ports:
      - "5433:5434"